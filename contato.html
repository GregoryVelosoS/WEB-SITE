<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralWave - Fale Conosco - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>
            <h1>ViralWave</h1>
            <p>Slogan: Surfando na onda digital para gerar resultados.</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="cases.html">Cases</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Fale Conosco</h1>
        
        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" placeholder="Ex: Orçamento, Dúvida">

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>Email fictício: contato@viralwave.ficticio.com</p>
        <p>Telefone fictício: (11) 99999-8888</p>
        <p>Ano atual: 2024</p>
    </footer>

</body>
</html>
